# Dependabot version updates: monthly, PRs against `dev`. Merging them, the
# security PRs on `main`, and the `global-agent` override (no ignore rule
# needed): docs/development.md § CI. Staging: docs/agents/staging.md step 1.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
      runtime:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
